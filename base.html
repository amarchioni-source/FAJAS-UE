<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block titulo %}Generación de Fajas UE{% endblock %}</title>
  <style>
    :root{
      --texto:#1b2430; --suave:#667085; --borde:#e4e8ee; --fondo-suave:#f6f8fb;
      --primario:#1f5fbf; --primario-osc:#174a96; --primario-claro:#eaf1fc;
      --ok:#17824f; --ok-fondo:#e8f6ef; --alerta:#a8620a; --alerta-fondo:#fff4e1;
      --error:#b3321f; --error-fondo:#fdecea;
      --sombra:0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.05);
    }
    *{box-sizing:border-box}
    html{background:#fff}
    body{margin:0;background:#fff;color:var(--texto);
      font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .franja{height:5px;background:linear-gradient(90deg,#8e44ad 0%,#2f6fd0 50%,#1fa971 100%)}
    header{border-bottom:1px solid var(--borde);background:#fff}
    .encabezado{max-width:980px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:14px}
    .marca{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;
      background:linear-gradient(135deg,#8e44ad,#2f6fd0 55%,#1fa971);color:#fff}
    .marca svg{width:26px;height:26px}
    header h1{margin:0;font-size:1.45rem;line-height:1.2;letter-spacing:-.01em}
    header p{margin:2px 0 0;color:var(--suave);font-size:.92rem}
    main{max-width:980px;margin:0 auto;padding:28px 20px 56px}
    .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:26px;
      box-shadow:var(--sombra);margin-bottom:20px}
    h2{margin:0 0 6px;font-size:1.25rem;letter-spacing:-.01em}
    .bajada{margin:0 0 20px;color:var(--suave)}
    svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;flex:none}

    /* avisos */
    .aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;
      margin:0 0 14px;font-size:.95rem}
    .aviso svg{margin-top:3px}
    .aviso.error{background:var(--error-fondo);color:var(--error)}
    .aviso.alerta{background:var(--alerta-fondo);color:var(--alerta)}
    .aviso.ok{background:var(--ok-fondo);color:var(--ok)}

    /* botones */
    .boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;
      background:var(--primario);color:#fff;border:1px solid var(--primario);border-radius:10px;
      padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;
      transition:background .15s, box-shadow .15s}
    .boton:hover{background:var(--primario-osc);box-shadow:0 4px 14px rgba(31,95,191,.25)}
    .boton[disabled]{opacity:.65;cursor:wait}
    .boton.sec{background:#fff;color:var(--primario)}
    .boton.sec:hover{background:var(--primario-claro);box-shadow:none}
    .boton.grande{padding:15px 28px;font-size:1.05rem}
    .boton.excel{background:var(--ok);border-color:var(--ok)}
    .boton.excel:hover{background:#126a40;box-shadow:0 4px 14px rgba(23,130,79,.28)}
    .acciones{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
    .pie{color:var(--suave);font-size:.86rem;margin:16px 0 0}
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  <div class="franja"></div>
  <header>
    <div class="encabezado">
      <div class="marca" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 5v14M8 5v14M12 5v14M16 5v14M20 5v14" opacity=".95"/>
          <path d="M6 5v14M14 5v14M18 5v14" stroke-width="1.2" opacity=".6"/>
        </svg>
      </div>
      <div>
        <h1>Generación de Fajas UE</h1>
        <p>Declaración Jurada de fajas de seguridad para mercado UE · Anexo V SENASA</p>
      </div>
    </div>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
