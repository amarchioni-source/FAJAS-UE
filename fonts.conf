<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Sustituye las fuentes Aptos (no disponibles en Linux) por DejaVu Sans,
     para que el PDF salga igual que el generado hasta ahora. -->
<fontconfig>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
